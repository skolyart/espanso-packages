
matches:
  # Normal Greek Letters
  - trigger: ":\\alpha "
    replace: "α"
  - trigger: ":\\beta "
    replace: "β"
  - trigger: ":\\Gamma "
    replace: "Γ"
  - trigger: ":\\gamma "
    replace: "γ"
  - trigger: ":\\Delta "
    replace: "Δ"
  - trigger: ":\\delta "
    replace: "δ"
  - trigger: ":\\epsilon "
    replace: "ε"
  - trigger: ":\\zeta "
    replace: "ζ"
  - trigger: ":\\eta "
    replace: "η"
  - trigger: ":\\Theta "
    replace: "Θ"
  - trigger: ":\\theta "
    replace: "θ"
  - trigger: ":\\iota "
    replace: "ι"
  - trigger: ":\\kappa "
    replace: "κ"
  - trigger: ":\\Lambda "
    replace: "Λ"
  - trigger: ":\\lambda "
    replace: "λ"
  - trigger: ":\\mu "
    replace: "μ"
  - trigger: ":\\nu "
    replace: "ν"
  - trigger: ":\\Xi "
    replace: "Ξ"
  - trigger: ":\\xi "
    replace: "ξ"
  - trigger: ":\\Pi "
    replace: "Π"
  - trigger: ":\\pi "
    replace: "π"
  - trigger: ":\\rho "
    replace: "ρ"
  - trigger: ":\\Sigma "
    replace: "Σ"
  - trigger: ":\\sigma "
    replace: "σ"
  - trigger: ":\\tau "
    replace: "τ"
  - trigger: ":\\Upsilon "
    replace: "ϒ"
  - trigger: ":\\upsilon "
    replace: "υ"
  - trigger: ":\\Phi "
    replace: "Φ"
  - trigger: ":\\phi "
    replace: "φ"
  - trigger: ":\\chi "
    replace: "χ"
  - trigger: ":\\Psi "
    replace: "Ψ"
  - trigger: ":\\psi "
    replace: "ψ"
  - trigger: ":\\Omega "
    replace: "Ω"
  - trigger: ":\\omega "
    replace: "ω"

  # Variant Greek Letters
  - trigger: ":\\varepsilon "
    replace: "ϵ"
  - trigger: ":\\vartheta "
    replace: "ϑ"
  - trigger: ":\\varkappa "
    replace: "ϰ"
  - trigger: ":\\varrho "
    replace: "ϱ"
  - trigger: ":\\varsigma "
    replace: "ς"
  - trigger: ":\\varphi "
    replace: "ϕ"