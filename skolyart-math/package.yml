# Math
matches:
  # Logic
  ## Metalogic
  - trigger: ":\\therefore "
    replace: "∴"
  - trigger: ":\\because "
    replace: "∵"
  - trigger: ":\\models "
    replace: "⊨"
  ## Propositional Logic
  - trigger: ":\\top "
    replace: "⊤"
  - trigger: ":\\bot "
    replace: "⊥"
  - trigger: ":\\neg "
    replace: "¬"
  - trigger: ":\\land "
    replace: "∧"
  - trigger: ":\\lor "
    replace: "∨"
  - trigger: ":\\lnot "
    replace: "¬"
  - trigger: ":\\implies "
    replace: "⇒"
  - trigger: ":\\impliedby "
    replace: "⇐"
  - trigger: ":\\equiv "
    replace: "⇔"
  ## Quantitative Logic
  - trigger: ":\\forall "
    replace: "∀"
  - trigger: ":\\exists "
    replace: "∃"
  ## Description Logic
  - trigger: ":\\equiv "
    replace: "≡"
  - trigger: ":\\sqcap "
    replace: "⊓"
  - trigger: ":\\sqcup "
    replace: "⊔"
  ### Concept Inclusion
  - trigger: ":\\sqsubseteq "
    replace: "⊑"
  - trigger: ":\\sqsupseteq "
    replace: "⊒"
  - trigger: ":\\sqsub "
    replace: "⊏"
  - trigger: ":\\sqsupset "
    replace: "⊐"
  # Set Theory
  ## Set Membership
  - trigger: ":\\in "
    replace: "∈"
  - trigger: ":\\ni "
    replace: "∋"
  - trigger: ":\\notin "
    replace: "∉"
  - trigger: ":\\notni "
    replace: "∌"
  ## Set Inclusion
  - trigger: ":\\subset "
    replace: "⊂"
  - trigger: ":\\subseteq "
    replace: "⊆"
  - trigger: ":\\supset "
    replace: "⊃"
  - trigger: ":\\supseteq "
    replace: "⊇"
  ## Set Operations
  - trigger: ":\\cup "
    replace: "∪"
  - trigger: ":\\cap "
    replace: "∩"
  # Order Theory
  - trigger: ":\\approx "
    replace: "≈"
  - trigger: ":\\le "
    replace: "≤"
  - trigger: ":\\ge "
    replace: "≥"
  # Abstract Algebra
  - trigger: ":\\cong "
    replace: "≅"
  ## Algebraic Operations
  - trigger: ":\\times "
    replace: "×"
  - trigger: ":\\div "
    replace: "÷"
  - trigger: ":\\oplus "
    replace: "⊕"
  - trigger: ":\\cdot "
    replace: "⊙"
  - trigger: ":\\sqrt "
    replace: "√"

  # Calculus
  - trigger: ":\\sum "
    replace: "∑"
  - trigger: ":\\int "
    replace: "∫"
  - trigger: ":\\dagger "
    replace: "†"

